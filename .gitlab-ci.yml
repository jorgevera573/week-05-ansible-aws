---
# Pipeline de validacion estatica.
#
# La sola presencia de este fichero desactiva Auto DevOps en el proyecto.
#
# El pipeline NO recibe credenciales de AWS ni de ningun otro cloud, NO ejecuta
# `terraform apply` ni `terraform destroy`, y NO se conecta por SSH a la EC2.
# Solo comprueba formato, sintaxis y buenas practicas del codigo del repositorio.

stages:
  - lint

default:
  interruptible: true
  tags:
    - cloudrun

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --- Ansible ----------------------------------------------------------------
# El runner shell utiliza Python 3.12 y un entorno virtual para las dependencias.
# El playbook usa exclusivamente modulos ansible.builtin, y ansible.cfg fija
# stdout_callback = ansible.builtin.default, asi que NO hace falta instalar
# ninguna coleccion de Galaxy en el CI.
ansible:lint:
  stage: lint
  variables:
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible.cfg
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3-venv git
    - |
      ANSIBLE_CI_TMP="$(mktemp -d)"
      trap 'rm -rf "$ANSIBLE_CI_TMP"' EXIT
      python3 -m venv "$ANSIBLE_CI_TMP/venv"
      . "$ANSIBLE_CI_TMP/venv/bin/activate"
      python -m pip install --no-cache-dir -r requirements-dev.txt
  script:
    - ansible --version
    - ansible-lint --version
    - yamllint --version
    - yamllint .
    - ansible-playbook site.yml --syntax-check
    - ansible-lint

# --- Terraform --------------------------------------------------------------
# `validate` necesita `init`, pero se hace con -backend=false: no se accede al
# estado, no se leen credenciales y no se crea ni modifica nada en AWS.
terraform:validate:
  stage: lint
  variables:
    TF_VERSION: "1.16.3"
    TF_IN_AUTOMATION: "true"
  before_script:
    - |
      set -euo pipefail
      TERRAFORM_CI_TMP="$(mktemp -d)"
      trap 'rm -rf "$TERRAFORM_CI_TMP"' EXIT

      case "$(uname -m)" in
        x86_64) TF_ARCH="amd64" ;;
        aarch64) TF_ARCH="arm64" ;;
        *) echo "Arquitectura no compatible"; exit 1 ;;
      esac

      TF_ARCHIVE="terraform_${TF_VERSION}_linux_${TF_ARCH}.zip"
      TF_BASE_URL="https://releases.hashicorp.com/terraform/${TF_VERSION}"

      (
        cd "$TERRAFORM_CI_TMP"
        curl -fsS --retry 3 -O "$TF_BASE_URL/$TF_ARCHIVE"
        curl -fsS --retry 3 \
          -o SHA256SUMS "$TF_BASE_URL/terraform_${TF_VERSION}_SHA256SUMS"
        awk -v archive="$TF_ARCHIVE" '$2 == archive {print}' \
          SHA256SUMS > selected.sha256
        test -s selected.sha256
        sha256sum -c selected.sha256
        unzip -q "$TF_ARCHIVE"
      )

      export PATH="$TERRAFORM_CI_TMP:$PATH"
  script:
    - cd infra
    - terraform version
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate
