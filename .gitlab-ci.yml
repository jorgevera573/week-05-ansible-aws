---
# Pipeline de validacion estatica.
#
# La sola presencia de este fichero desactiva Auto DevOps en el proyecto.
#
# El pipeline NO recibe credenciales de AWS ni de ningun otro cloud, NO ejecuta
# `terraform apply` ni `terraform destroy`, y NO se conecta por SSH a la EC2.
# Solo comprueba formato, sintaxis y buenas practicas del codigo del repositorio.

stages:
  - lint

default:
  interruptible: true
  tags:
    - cloudrun

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --- Ansible ----------------------------------------------------------------
# ansible-core 2.21 exige Python >= 3.12 en el nodo de control: de ahi la imagen.
# El playbook usa exclusivamente modulos ansible.builtin, y ansible.cfg fija
# stdout_callback = ansible.builtin.default, asi que NO hace falta instalar
# ninguna coleccion de Galaxy en el CI.
ansible:lint:
  stage: lint
  image: python:3.12-slim
  variables:
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible.cfg
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    # ansible-lint descubre los ficheros con git; sin el, degrada a un escaneo
    # del sistema de ficheros y emite avisos.
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - python -m pip install --no-cache-dir -r requirements-dev.txt
  script:
    - echo "== Versiones =="
    - ansible --version | head -1
    - ansible-lint --version | head -1
    - yamllint --version
    - echo "== yamllint =="
    - yamllint .
    - echo "== ansible-playbook --syntax-check =="
    - ansible-playbook site.yml --syntax-check
    - echo "== ansible-lint =="
    - ansible-lint

# --- Terraform --------------------------------------------------------------
# `validate` necesita `init`, pero se hace con -backend=false: no se accede al
# estado, no se leen credenciales y no se crea ni modifica nada en AWS.
terraform:validate:
  stage: lint
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  script:
    - cd infra
    - terraform version
    - echo "== terraform fmt -check =="
    - terraform fmt -check -recursive
    - echo "== terraform init -backend=false =="
    - terraform init -backend=false -input=false
    - echo "== terraform validate =="
    - terraform validate
