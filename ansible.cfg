# Configuracion de Ansible para esta practica.
#
# IMPORTANTE: el repositorio vive en /mnt/c (montaje DrvFs de WSL). Ese montaje
# expone los ficheros como world-writable, y Ansible ignora por seguridad un
# ansible.cfg en esas condiciones. Por eso SIEMPRE hay que invocar Ansible con
# la ruta absoluta explicita:
#
#   export ANSIBLE_CONFIG=/mnt/c/MASTER-ING-SOFTWARE/semana-05/1.4.30-ansible-aws/ansible.cfg

[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
interpreter_python   = auto_silent

# Salida legible sin depender de colecciones externas.
# El callback `community.general.yaml` fue retirado de community.general, por lo
# que `stdout_callback = yaml` rompia la ejecucion. El equivalente actual es el
# callback por defecto de ansible-core con el formato de resultado en YAML.
# Ademas, asi el CI solo necesita ansible-core, sin instalar colecciones.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml
force_valid_group_names = ignore
retry_files_enabled  = False
display_skipped_hosts = False
nocows               = True

# La verificacion de host keys NO se desactiva. La huella se acepto en la
# primera conexion tras contrastarla por un canal AWS autenticado
# (salida de consola de la instancia via AWS CLI/consola EC2).
host_key_checking    = True

[privilege_escalation]
become        = False
become_method = sudo
become_user   = root

[ssh_connection]
# La clave privada tiene passphrase: se usa el ssh-agent de la terminal WSL.
# No se añade IdentitiesOnly para que ssh pueda usar la identidad del agente.
ssh_args      = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
pipelining    = True
